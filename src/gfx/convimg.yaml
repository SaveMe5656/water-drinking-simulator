palettes:
  - name: wds_palette
    fixed-entries:
      - image: palette.png

converts:
  - name: wds_background
    palette: wds_palette
    compress: zx7
    width-and-height: false
    images:
      - waterd2.png
      - waterd33.png
  - name: wds_progressbar
    palette: wds_palette
    tilesets:
      images:
        - progressbar.png
      tile-width: 1
      tile-height: 7

outputs:
  - type: c
    include-file: gfx.h
    palettes:
      - wds_palette
    converts:
      - wds_background
      - wds_progressbar
